plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pingthelan.motionwake'
    compileSdk 35

    defaultConfig {
        applicationId "com.pingthelan.motionwake"
        minSdk 15
        targetSdk 15
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
